services:
  freshgrade:
    build:
      context: .
      args:
        INSTALL_ML: "0"   # set to "1" to include YOLO + PyTorch
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/runtime:/app/data/runtime
      - ./artifacts:/app/artifacts
