name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (unit, integration, end-to-end)
        env:
          FRESHGRADE_DETECTOR: classical
          FRESHGRADE_LLM: disabled
        run: python -m pytest -v
